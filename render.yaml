services:
  # 1. FastAPI Backend Web Service
  - type: web
    name: nyayaflow-backend
    runtime: python
    region: oregon
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHONPATH
        value: backend
      - key: APP_ENV
        value: development
      - key: DEMO_MODE
        value: "true"
      - key: SECRET_KEY
        generateValue: true
      - key: MASTER_KEY
        generateValue: true

  # 2. React + Vite Frontend Static Site (Distributed on Global CDN)
  - type: web
    name: nyayaflow-frontend
    runtime: static
    buildCommand: cd frontend && npm install --legacy-peer-deps && npm run build
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://nyayaflow-backend.onrender.com
    routes:
      # Single-Page Application (SPA) routing for React Router
      - type: rewrite
        source: /*
        destination: /index.html
