version: '3.8'

services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nyayaflow}
      POSTGRES_USER: ${POSTGRES_USER:-nyaya}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nyayaflowsecurepass2026}
    ports:
      - "5432:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql://nyaya:nyayaflowsecurepass2026@db:5432/nyayaflow
      SECRET_KEY: ${SECRET_KEY:-nyayaflow-super-secret-jwt-key-2026-bharat-hackathon}
      MASTER_KEY: ${MASTER_KEY:-NyayaFlowMasterKeySecure202632B!}
      MINIO_ENDPOINT: minio:9000
    depends_on:
      - db
      - minio
    ports:
      - "8000:8000"
    volumes:
      - ./storage:/app/storage

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:3000"

volumes:
  dbdata:
  miniodata:

